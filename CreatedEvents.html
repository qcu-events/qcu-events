<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Created Events | QCU EVENTS</title>
    <link rel="stylesheet" href="style.css">
    <script src="events.js" defer></script>
</head>
<body>
    <div class="acct">
        <aside class="side">
            <h3>Your account</h3>
            <a href="Account.html">Profile</a>
            <a href="History.html">History of Events</a>
            <a href="Registered.html" data-role="participant">History of Registered Events</a>
            <a href="CreatedEvents.html" class="active" aria-current="page" data-role="organizer">Events Created</a>
            <a href="About.html">About</a>
            <a href="participantpage.html" data-home>&larr; Back to QCU Events</a>
            <a href="index.html" data-logout>Log Out</a>
        </aside>
        <main class="main">
            <h1>Events Created</h1>
            <section class="history-card">
                <p>Events you created.</p>
                <table>
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Participants</th>
                        </tr>
                    </thead>
                    <!-- events.js should fill this with the events created by the logged-in organizer -->
                    <tbody id="createdBody">
                        <tr>
                            <td colspan="4">No events created yet.</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
